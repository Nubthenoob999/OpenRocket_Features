plugins {
    id 'java'
    id 'com.adarshr.test-logger' version '4.0.0'
    id 'checkstyle'
    id 'org.gradlex.extra-java-module-info' version '1.13.1'
}

java {
    // Must be disabled in order to use the gradle-modules-plugin
    modularity.inferModulePath = false
}

def buildProperties = new Properties()
file('../core/src/main/resources/build.properties').withInputStream { buildProperties.load(it) }
group = 'info.openrocket'
version = buildProperties['build.version']

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }
    maven { url = "https://jogamp.org/deployment/maven/" }
}

checkstyle {
    ignoreFailures = false
    maxWarnings = 0
}

configurations {
    testArtifactsClasspath {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
}

// Some older libraries are not modularized, so we need to add module-info.java files for them.
extraJavaModuleInfo {
    failOnMissingModuleInfo = false
    skipLocalJars = true
    automaticModule('slf4j-api-1.7.25.jar', 'org.slf4j.api')
    automaticModule('slf4j-api-1.7.32.jar', 'org.slf4j.api')
    automaticModule('versioncompare-1.5.0.jar', 'versioncompare')
    // ImageN ships its original and replacement scale operators as two JARs with one package.
    // GeoTools vector rendering reaches ScaleOpImage while WMS raster rendering reaches
    // Scale2OpImage, so both are needed. Merge them into one JPMS module to remove the split.
    automaticModule('org.eclipse.imagen:scale', 'org.eclipse.imagen.scale') {
        mergeJar('org.eclipse.imagen:scale2')
    }
    module('gluegen-rt-2.6.0.jar', 'org.jogamp.gluegen.rt', '2.6.0') {
        requires('java.desktop')
        exportAllPackages()
    }
    module('jogl-all-2.6.0.jar', 'org.jogamp.jogl.all', '2.6.0') {
        requires('java.desktop')
        requires('org.jogamp.gluegen.rt')
        exportAllPackages()
    }
    module('jcommon-1.0.24.jar', 'jcommon', '1.0.24') {
        requires('java.desktop')
        exportAllPackages()
    }
    module('itextpdf-5.5.13.3.jar', 'itextpdf') {
        requires('java.desktop')
        exportAllPackages()
    }

    automaticModule('obj-0.4.0.jar', 'de.javagl.obj')
}

dependencies {
    implementation(project(path: ':core', configuration: 'default'))

    implementation 'de.javagl:obj:0.4.0'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.commons:commons-lang3:3.19.0'
    implementation 'org.commonmark:commonmark:0.27.0'
    implementation 'com.google.inject:guice:7.0.0'
    implementation 'com.itextpdf:itextpdf:5.5.13.3'
    implementation 'org.jfree:jcommon:1.0.24'
    implementation 'org.jfree:jfreechart:1.5.6'
    implementation 'com.miglayout:miglayout-core:11.4.2'
    implementation 'com.miglayout:miglayout-swing:11.4.2'
    implementation 'com.fifesoft:rsyntaxtextarea:3.6.0'

    implementation 'io.github.g00fy2:versioncompare:1.5.0'
    implementation 'com.github.Dansoftowner:jSystemThemeDetector:3.9.1'

    implementation 'com.formdev:flatlaf:3.6.2'
    implementation 'com.formdev:flatlaf-extras:3.6.2'
    implementation 'com.formdev:flatlaf-intellij-themes:3.6.2'
    implementation 'com.github.weisj:jsvg:2.0.0'

    implementation 'ch.qos.logback:logback-core:1.5.20'
    implementation 'ch.qos.logback:logback-classic:1.5.20'

    implementation 'org.jogamp.gluegen:gluegen-rt-main:2.6.0'
    implementation 'org.jogamp.jogl:jogl-all-main:2.6.0'

    implementation platform('org.geotools:gt-bom:35.1')
    implementation('org.geotools:gt-swing') {
        // GeoTools still declares the pre-module MigLayout 3.7 bundle. OpenRocket already uses
        // the split core/swing artifacts, and keeping both exposes duplicate Java packages.
        exclude group: 'com.miglayout', module: 'miglayout'
    }
    implementation 'org.geotools:gt-epsg-hsql'
    implementation 'org.geotools:gt-wms'
    // systems-common 2.1 has an explicit JPMS requirement but omits this artifact from its POM.
    implementation 'systems.uom:systems-quantity:2.1'
    // GeoTools upgrades Guava to a release that no longer pulls this existing Swing JPMS module.
    implementation 'org.checkerframework:checker-qual:3.54.0'

    testImplementation 'ch.qos.logback:logback-classic:1.5.20'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

tasks.register('geoToolsMapLiveTest', JavaExec) {
    group = 'verification'
    description = 'Loads a real ORK file, runs 100 Monte Carlo trajectories, and opens the GeoTools diagnostic viewer.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'info.openrocket.swing.gui.simulation.GeoToolsMapLiveDiagnostic'
    workingDir = rootProject.projectDir
    systemProperty 'java.awt.headless', System.getProperty('java.awt.headless', 'false')

    args '--ork=' + providers.gradleProperty('geoToolsOrk').getOrElse(
                    rootProject.file('core/src/main/resources/datafiles/examples/A simple model rocket.ork').absolutePath),
            '--runs=' + providers.gradleProperty('geoToolsRuns').getOrElse('100'),
            '--latitude=' + providers.gradleProperty('geoToolsLatitude').getOrElse('35.1758'),
            '--longitude=' + providers.gradleProperty('geoToolsLongitude').getOrElse('-76.8283'),
            '--viewer-seconds=' + providers.gradleProperty('geoToolsViewerSeconds').getOrElse('20'),
            '--output=' + providers.gradleProperty('geoToolsOutput').getOrElse(
                    rootProject.layout.buildDirectory.dir('reports/geotools-live').get().asFile.absolutePath)
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                // TODO: we should really increase this...
                minimum = 0.05
            }
        }
    }
}
