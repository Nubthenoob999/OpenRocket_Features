def appVersionForJpackage = {
    def numericSegments = version.toString().findAll(/\d+/)
    if (numericSegments.isEmpty()) {
        return '1.0.0'
    }
    def normalizedSegments = numericSegments.take(4)
    while (normalizedSegments.size() < 3) {
        normalizedSegments << '0'
    }
    return normalizedSegments.join('.')
}.call()
