tasks.register('prepareJpackageInput', Copy) {
    group = 'distribution'
    description = 'Copies the runnable shadow JAR into the jpackage input directory.'

    dependsOn tasks.named('shadowJar', ShadowJar)
    from(tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
    into(jpackageInputDir)
    rename { "${appName}.jar" }
}

tasks.register('resolveJpackageModules') {
    group = 'distribution'
    description = 'Calculates the JDK modules required by the packaged application.'

    dependsOn tasks.named('shadowJar', ShadowJar)
    inputs.file(tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
    outputs.file(jpackageModulesFile)

    doLast {
        def shadowJarFile = tasks.named('shadowJar', ShadowJar).get().archiveFile.get().asFile
        def detectedModules = collectJpackageModules(shadowJarFile)
        def outputFile = jpackageModulesFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = detectedModules + System.lineSeparator()
        println "Resolved jpackage runtime modules: ${detectedModules}"
    }
}

tasks.register('jpackageAppImage') {
    group = 'distribution'
    description = 'Builds a Project Imperia app image with jpackage using the shadow JAR.'

    dependsOn 'prepareJpackageInput', 'resolveJpackageModules'
    inputs.dir(jpackageInputDir)
    inputs.file(jpackageModulesFile)
    outputs.dir(jpackageAppImageDir)

    doLast {
        def inputDir = jpackageInputDir.get().asFile
        def outputDir = jpackageAppImageDir.get().asFile
        def detectedModules = jpackageModulesFile.get().asFile.text.trim()

        delete(outputDir)
        outputDir.mkdirs()

        def arguments = [
                '--type', 'app-image',
                '--dest', outputDir.absolutePath,
                '--input', inputDir.absolutePath,
                '--name', appName,
                '--main-jar', "${appName}.jar",
                '--main-class', application.mainClass.get(),
                '--app-version', appVersionForJpackage,
                '--vendor', appVendor,
                '--description', appDescription,
                '--copyright', "Copyright 2013-${buildProperties['build.copyright']} Project Imperia contributors",
                '--icon', appIconPath,
                '--add-modules', detectedModules,
                '--verbose'
        ]
        launcherJvmArgs.each { option ->
            arguments.addAll(['--java-options', option.toString()])
        }

        runJpackage(arguments)
        println "Created jpackage app image in '${outputDir.absolutePath}'."
    }
}

tasks.register('jpackageInstaller') {
    group = 'distribution'
    description = 'Builds a platform installer from the jpackage app image.'

    dependsOn 'jpackageAppImage'
    inputs.dir(jpackageAppImageDir)
    outputs.dir(jpackageInstallerDir)

    doLast {
        def installerType = jpackageType.get()
        def outputDir = jpackageInstallerDir.get().asFile
        def appImagePath = new File(jpackageAppImageDir.get().asFile, packagedAppImageName)

        if (!appImagePath.exists()) {
            throw new GradleException("Expected jpackage app image at '${appImagePath.absolutePath}', but it was not found.")
        }

        delete(outputDir)
        outputDir.mkdirs()

        Map<String, String> jpackageEnv = [:]
        if (isWindows && installerType in ['exe', 'msi']) {
            def wixDir = rootProject.file('tools/wix3')
            if (wixDir.isDirectory()) {
                def currentPath = System.getenv('PATH') ?: ''
                jpackageEnv['PATH'] = wixDir.absolutePath + File.pathSeparator + currentPath
            }
            def wixResult = runExternalCommand(['where.exe', 'candle.exe'], false, jpackageEnv)
            if (wixResult.exitValue != 0) {
                throw new GradleException("WiX Toolset was not found on PATH. Install WiX 3.x before running jpackageInstaller, or use jpackageAppImage instead.")
            }
        }

        def arguments = [
                '--type', installerType,
                '--dest', outputDir.absolutePath,
                '--name', appName,
                '--app-image', appImagePath.absolutePath,
                '--app-version', appVersionForJpackage,
                '--vendor', appVendor,
                '--description', appDescription,
                '--copyright', "Copyright 2013-${buildProperties['build.copyright']} Project Imperia contributors",
                '--about-url', appUrl,
                '--icon', appIconPath,
                '--verbose'
        ]

        if (isWindows) {
            arguments.addAll([
                    '--win-dir-chooser',
                    '--win-menu',
                    '--win-menu-group', appName,
                    '--win-shortcut',
                    '--win-shortcut-prompt'
            ])
        }

        runJpackage(arguments, jpackageEnv)
        println "Created jpackage installer artifacts in '${outputDir.absolutePath}'."
    }
}

def configureInstall4jTask = { task, List<String> buildIds, String taskDescription ->
    task.group = 'distribution'
    task.description = taskDescription
    task.dependsOn tasks.named('shadowJar', ShadowJar)
    task.projectFile = install4jProjectFile
    task.release = projectVersionString
    task.destination = install4jMediaDir.get().asFile
    task.buildIds = buildIds
    task.variables = [
            JAR_NAME: tasks.named('shadowJar', ShadowJar).get().archiveFileName.get()
    ]
    task.inputs.file(tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile })
    task.inputs.files(fileTree(install4jProjectDir) {
        exclude 'code_signing/**'
    })

    task.doFirst {
        if (!install4jProjectFile.exists()) {
            throw new GradleException("install4j project file '${install4jProjectFile.absolutePath}' does not exist.")
        }

        install4jMediaDir.get().asFile.mkdirs()
    }

    task.doLast {
        def outputDir = install4jMediaDir.get().asFile
        def expectedFiles = buildIds.collect { install4jExpectedArtifacts[it] }.findAll { it != null }
        def missingFiles = expectedFiles.findAll { !new File(outputDir, it).exists() }

        if (!missingFiles.isEmpty()) {
            throw new GradleException(
                    "install4j did not produce all requested media files in '${outputDir.absolutePath}'. " +
                            "Missing: ${missingFiles.join(', ')}. " +
                            "macOS media builds require an install4j Multi-Platform Edition; the auto-provisioned evaluation build skips them."
            )
        }
    }
}

tasks.register('install4jWindowsInstallers', com.install4j.gradle.Install4jTask) {
    configureInstall4jTask(delegate, install4jBuildIds.windows, 'Builds install4j Windows installers for Intel/AMD64 and ARM64.')
}

tasks.register('install4jMacInstallers', com.install4j.gradle.Install4jTask) {
