def runExternalCommand = { List<String> command, boolean inheritIo = false, Map<String, String> extraEnv = [:] ->
    def normalizedCommand = command.collect { it.toString() }
    def processBuilder = new ProcessBuilder(normalizedCommand)
    processBuilder.directory(rootDir)
    if (extraEnv != null && !extraEnv.isEmpty()) {
        processBuilder.environment().putAll(extraEnv)
    }
    if (inheritIo) {
        processBuilder.inheritIO()
    }

    def process = processBuilder.start()
    def stdout = inheritIo ? '' : process.inputStream.getText('UTF-8')
    def stderr = inheritIo ? '' : process.errorStream.getText('UTF-8')
    def exitValue = process.waitFor()

    return [
            exitValue: exitValue,
            stdout   : stdout,
            stderr   : stderr
    ]
}

def collectJpackageModules = { File jarFile ->
    def result = runExternalCommand([
            toolExecutable('jdeps'),
            '--ignore-missing-deps',
            '--multi-release', '17',
            '--print-module-deps',
            jarFile.absolutePath
    ])
    if (result.exitValue != 0) {
        throw new GradleException("jdeps failed while resolving modules for jpackage:\n${result.stderr.trim()}")
    }

    def outputLines = result.stdout
            .readLines()
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    def moduleLine = outputLines ? outputLines.last() : ''
    def warningLines = outputLines.size() > 1 ? outputLines[0..-2] : []
    if (!warningLines.isEmpty()) {
        println "jdeps warnings:\n${warningLines.join('\n')}"
    }

    def detectedModules = moduleLine
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    def extraModules = jpackageExtraModules.get()
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
    def allModules = (detectedModules + extraModules).unique()
    return allModules.isEmpty() ? 'java.base' : allModules.join(',')
}

def runJpackage = { List<String> arguments, Map<String, String> extraEnv = [:] ->
    def result = runExternalCommand(([toolExecutable('jpackage')] + arguments) as List<String>, false, extraEnv)
    if (result.exitValue != 0) {
        def details = [result.stdout, result.stderr]
                .findAll { it != null && !it.trim().isEmpty() }
                .join(System.lineSeparator())
        throw new GradleException("jpackage failed with exit code ${result.exitValue}.${details ? System.lineSeparator() + details : ''}")
    }
}

