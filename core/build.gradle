}

tasks.register('offlineTableFlightComparison', Test) {
    useJUnitPlatform {
        includeTags 'offline-table-flight-comparison'
    }
    description = 'Runs every bundled recorded flight through matched baseline and strict offline-table simulations.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'info/openrocket/core/tuning/OfflineTableFlightComparisonHarnessTest.class'
    systemProperty 'offlineTableComparison.runFlightSuite', 'true'
    systemProperty 'offlineTableComparison.outputDir',
            layout.buildDirectory.dir('reports/offline-table-flight-comparison').get().asFile.absolutePath
    if (project.hasProperty('offlineFlightName')) {
        systemProperty 'offlineTableComparison.flightName', project.property('offlineFlightName')
    }
    shouldRunAfter tasks.named('test')
    outputs.upToDateWhen { false }
}

tasks.register('physicsAeroSourceGuard') {
    description = 'Rejects executable source that reintroduces the removed legacy aerodynamic runtime.'
    group = 'verification'

    doLast {
        // Keep the guard itself from containing the forbidden tokens verbatim.
        def forbidden = [
                'info.openrocket.core.aerodynamics.' + 'rom',
                'RomAerodynamic' + 'Calculator',
                'PathlineROM' + 'Calculator',
                'Pathline' + 'Seed',
                'Rom' + 'Surface',
                'Aero' + 'Surface4D',
                java.util.regex.Pattern.compile('(?i)path' + 'line\\s+(seed|surface)')
        ]
        def parserAllowlist = [
                file('src/main/java/info/openrocket/core/file/openrocket/importt/SimulationConditionsHandler.java').canonicalFile,
                file('src/main/java/info/openrocket/core/file/openrocket/importt/SingleSimulationHandler.java').canonicalFile
        ] as Set
        def roots = [
                fileTree('src') { include '**/*.java' },
                fileTree('../swing/src') { include '**/*.java' },
                fileTree('..') {
                    include '*.gradle', '**/*.gradle'
                    exclude '**/build/**', '**/.gradle/**', 'reports/**'
                }
        ]
        def violations = []
        roots.each { tree ->
            tree.files.each { source ->
                if (!parserAllowlist.contains(source.canonicalFile)) {
                    def text = source.getText('UTF-8')
                    forbidden.each { token ->
                        if (token instanceof java.util.regex.Pattern ? token.matcher(text).find() : text.contains(token)) {
                            violations << "${rootProject.relativePath(source)}: ${token}"
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Removed aerodynamic runtime references found:\n' +
                    violations.unique().sort().collect { '  - ' + it }.join('\n'))
        }
    }
}

tasks.register('physicsAeroOrkValidation', Test) {
    useJUnitPlatform()
    description = 'Runs the opt-in external .ork flight-validation corpus.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'info/openrocket/core/aerodynamics/physicsaero/validation/PhysicsAeroOrkValidationTest.class'
    outputs.upToDateWhen { false }

    [
            'physicsAeroOrkValidationDir',
            'physicsAeroOrkValidationManifest',
            'physicsAeroOrkMode',
            'physicsAeroRequireFlightValidation',
            'physicsAeroOrkValidationReport'
    ].each { propertyName ->
        if (project.hasProperty(propertyName)) {
            systemProperty propertyName, project.property(propertyName)
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('physicsAeroSourceGuard')
}

// ─── JaCoCo coverage ─────────────────────────────────────────────────────────

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.6
            }
        }
    }
}

// ─── Motor database serialization ────────────────────────────────────────────

def serializedEnginesPath     = './src/main/resources/datafiles/thrustcurves/thrustcurves.db'
def serializedEnginesPathDist = './build/resources/main/datafiles/thrustcurves/thrustcurves.db'

tasks.register('serializeEngines') {
    dependsOn serializeEnginesDelete
    dependsOn serializeEnginesExecute
}

tasks.register('serializeEnginesDist') {
    dependsOn serializeEnginesExecuteDist
}

tasks.register('serializeEnginesDelete', Delete) {
    delete fileTree(serializedEnginesPath)
    doFirst { println "Starting serializeEnginesDelete..." }
    doLast  { println "...serializeEnginesDelete Completed" }
}

tasks.register('serializeEnginesExecute', JavaExec) {
    dependsOn serializeEnginesDelete
    workingDir  new File(projectDir, 'build/tmp')
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('info.openrocket.core.thrustcurve.serialization.SerializeThrustcurveMotors')
    args = [
        '../../resources-src/datafiles/thrustcurves/',
        '../.' + serializedEnginesPath,
        threadUtilFraction
    ]
    standardInput = System.in
    doFirst { println "Starting serializeEnginesExecute..." }
    doLast  { println "...serializeEnginesExecute Completed" }
}

tasks.register('serializeEnginesExecuteDist', JavaExec) {
    dependsOn serializeEnginesDelete
    workingDir  new File(projectDir, 'build/tmp')
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('info.openrocket.core.thrustcurve.serialization.SerializeThrustcurveMotors')
    args '../../resources-src/datafiles/thrustcurves/', '../.' + serializedEnginesPathDist, threadUtilFraction
    standardInput = System.in
    doFirst { println "Starting serializeEnginesExecuteDist..." }
    doLast  { println "...serializeEnginesExecuteDist Completed" }
}

tasks.register('serializeEnginesValidate') {
    group = 'verification'
    description = 'Verifies that the serialized motor database exists before packaging.'

    doLast {
        if (!project.file(serializedEnginesPath).exists()) {
            def message = "The SQLite motor database does not exist at the following location:\n" +
                "${project.file(serializedEnginesPath)}.\n" +
                "Run the following to generate it:\n" +
                "% ./gradlew serializeEngines\n"
            println message
            throw new GradleException('Invalid motor database file.')
        } else {
            println "SQLite motor database found.\n"
        }
    }
}

// ─── Resources ───────────────────────────────────────────────────────────────

tasks.register('copyReadmeMain', Copy) {
    from('../') { include 'ReleaseNotes.md' }
    into './src/main/resources'
}

tasks.named('sourcesJar') {
    // The sources archive includes resources copied into src/main/resources at build time.
    dependsOn 'copyReadmeMain', 'externalComponentsCopy'
}

// ─── External component database (submodule) ─────────────────────────────────

def externalComponentsPath     = './src/main/resources/datafiles/components/database'
def externalResourceComponents = './resources-src/datafiles/openrocket-database'

tasks.register("submoduleInit", Exec) {
    workingDir = "../"
    commandLine("git", "submodule", "init")
}

tasks.register("subModuleUpdate", Exec) {
    dependsOn 'submoduleInit'
    workingDir = "../"
    commandLine("git", "submodule", "update", "--remote")
}

tasks.register('externalComponentsCopy', Copy) {
    dependsOn 'externalComponentsValidate'
    from(externalResourceComponents + '/orc') { include '**/*' }
    from(externalResourceComponents)           { include 'LICENSE', 'README.md' }
    into externalComponentsPath
    exclude '**/*.bak'
    includeEmptyDirs = false
    eachFile { details -> println "Copying $details.sourcePath to $details.path ..." }
}

tasks.register('externalComponentsDelete', Delete) {
    delete fileTree(externalComponentsPath)
}

tasks.register('externalComponentsValidate') {
    group = 'verification'
    description = 'Verifies that the external component database submodule is available.'

    File dir    = project.file(externalResourceComponents + '/orc') as File
    File gitDir = project.file('../.git') as File

    if (!dir.exists() && gitDir.exists()) {
        dependsOn subModuleUpdate
    }

    doLast {
        println "Validating external components at ${dir}..."
        if (!dir.exists()) {
            def message = "The component database is a submodule and must be included to compile.\n"
            if (gitDir.exists()) {
                message += "Run manually:\n% git submodule init\n% git submodule update --remote\n"
                println message
                throw new GradleException('Invalid external component resources.')
            } else {
                message += "Download from https://github.com/openrocket/openrocket-database\n" +
                           "and copy into './core/${externalResourceComponents}'\n"
                println message
                throw new GradleException('Invalid external component resources.')
            }
        } else {
            println "Found external components"
        }
    }
}

// ─── Task dependencies ───────────────────────────────────────────────────────

// Get the short git commit hash to append to snapshot versions embedded in build.properties.
def gitCommitHash = 'unknown'
try {
    gitCommitHash = 'git rev-parse --short HEAD'.execute([], rootDir).text.trim()
} catch (ignored) {}

processResources {
    inputs.property('gitCommitHash', gitCommitHash)
    filesMatching('build.properties') {
        filter { line ->
            if (line.startsWith('build.version=') && line.trim().endsWith('-SNAPSHOT')) {
                "${line}-${gitCommitHash}"
            } else {
                line
            }
        }
    }
}

clean.dependsOn([externalComponentsDelete])
processResources.dependsOn([externalComponentsCopy])
processResources.dependsOn([copyReadmeMain])
processResources.dependsOn('serializeEnginesValidate')

